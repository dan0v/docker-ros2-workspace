services:
  ros2:
    build:
      context: .
      args:
        USERNAME: ${USER:-ros2user}
        USER_UID: 1000
        USER_GID: 1000
    image: ros2-humble-dev:latest
    container_name: ros2-workspace
    network_mode: host
    ipc: host
    pid: host
    # Rootless podman
    userns_mode: keep-id:uid=1000,gid=1000
    # SELinux: allow access to the X11/Wayland sockets and ./src.
    security_opt:
      - label:disable
    stdin_open: true
    tty: true
    working_dir: /home/ws

    environment:
      - ROS_DOMAIN_ID=42
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      # XWayland for X11-only apps (turtlesim links Xlib directly)
      - DISPLAY=${DISPLAY:-:0}
      # Native Wayland for Qt apps (needs qtwayland5 in the image)
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/xdg-runtime
      - QT_QPA_PLATFORM=wayland;xcb
      - LIBGL_ALWAYS_SOFTWARE=1

    volumes:
      # Workspace with persistent build cache
      - workspace:/home/ws

      # Source code overlays on top
      - ./src:/home/ws/src

      # Wayland socket
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/xdg-runtime/wayland-0

      # XWayland socket
      - /tmp/.X11-unix:/tmp/.X11-unix

    command: /bin/bash

volumes:
  workspace:
